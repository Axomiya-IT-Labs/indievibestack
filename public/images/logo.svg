<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="title desc">
  <title id="title">IndieVibeStack</title>
  <desc id="desc">IndieVibeStack logo with a layered pink, purple and cyan icon and the tagline Make a Living with AI.</desc>
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4FA3"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="vibe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3FA4"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(28 25)" filter="url(#shadow)">
    <rect x="18" y="102" width="112" height="72" rx="25" transform="rotate(45 74 138)" fill="url(#cyan)"/>
    <rect x="18" y="72" width="112" height="72" rx="25" transform="rotate(45 74 108)" fill="url(#purple)"/>
    <rect x="18" y="42" width="112" height="112" rx="30" transform="rotate(45 74 98)" fill="url(#pink)"/>
    <path d="M74 57 C82 78 94 90 115 98 C94 106 82 118 74 139 C66 118 54 106 33 98 C54 90 66 78 74 57Z" fill="#fff"/>
  </g>

  <!-- Wordmark -->
  <text x="190" y="112"
        font-family="Inter, Poppins, Manrope, Arial, sans-serif"
        font-size="78" font-weight="800" letter-spacing="-3">
    <tspan fill="#111827">Indie</tspan><tspan fill="url(#vibe)">Vibe</tspan><tspan fill="#111827">Stack</tspan>
  </text>

  <!-- Tagline -->
  <text x="194" y="157"
        font-family="Inter, Poppins, Manrope, Arial, sans-serif"
        font-size="25" font-weight="500" letter-spacing=".2"
        fill="#64748B">Make a Living with AI</text>
</svg>
